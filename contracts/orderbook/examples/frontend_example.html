<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrderBook 实时订单簿</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #fff;
            font-size: 32px;
        }

        .controls {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .controls label {
            font-weight: bold;
        }

        .controls input {
            flex: 1;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 4px;
            background: #2a2a2a;
            color: #fff;
            font-size: 14px;
        }

        .controls button {
            padding: 10px 20px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .controls button:hover {
            background: #1976D2;
        }

        .controls button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .status {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4CAF50;
            animation: pulse 2s infinite;
        }

        .status-indicator.disconnected {
            background: #f44336;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .orderbook-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .orderbook-panel {
            background: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
        }

        .panel-header {
            padding: 15px;
            font-weight: bold;
            font-size: 18px;
            border-bottom: 2px solid #333;
        }

        .panel-header.buy {
            background: linear-gradient(to right, #1a1a1a, #1b3a1b);
            color: #4CAF50;
        }

        .panel-header.sell {
            background: linear-gradient(to right, #1a1a1a, #3a1b1b);
            color: #f44336;
        }

        .order-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .order-list::-webkit-scrollbar {
            width: 8px;
        }

        .order-list::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        .order-list::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        .order-list::-webkit-scrollbar-thumb:hover {
            background: #444;
        }

        .order-header {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            padding: 10px 15px;
            background: #2a2a2a;
            font-weight: bold;
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
        }

        .order-item {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            padding: 10px 15px;
            border-bottom: 1px solid #2a2a2a;
            font-size: 14px;
            transition: background 0.2s;
        }

        .order-item:hover {
            background: #252525;
        }

        .order-item.buy .price {
            color: #4CAF50;
        }

        .order-item.sell .price {
            color: #f44336;
        }

        .stats {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: #999;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
        }

        .empty-state {
            padding: 40px;
            text-align: center;
            color: #666;
            font-size: 14px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .order-item.new {
            animation: fadeIn 0.3s ease-out;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 OrderBook 实时订单簿</h1>

        <div class="controls">
            <label>代币地址:</label>
            <input type="text" id="tokenAddress" placeholder="0x..." value="">
            <button id="subscribeBtn">订阅</button>
            <button id="unsubscribeBtn" disabled>取消订阅</button>
        </div>

        <div class="status">
            <div class="status-item">
                <div class="status-indicator" id="statusIndicator"></div>
                <span id="statusText">未连接</span>
            </div>
            <div class="status-item">
                <span>最后更新: <span id="lastUpdate">-</span></span>
            </div>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-label">最佳买价</div>
                <div class="stat-value" id="bestBid">-</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">最佳卖价</div>
                <div class="stat-value" id="bestAsk">-</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">价差</div>
                <div class="stat-value" id="spread">-</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">中间价</div>
                <div class="stat-value" id="midPrice">-</div>
            </div>
        </div>

        <div class="orderbook-container">
            <div class="orderbook-panel">
                <div class="panel-header buy">买单 (Bids)</div>
                <div class="order-header">
                    <div>价格 (ETH)</div>
                    <div>数量</div>
                    <div>累计</div>
                </div>
                <div class="order-list" id="buyOrders">
                    <div class="empty-state">暂无买单</div>
                </div>
            </div>

            <div class="orderbook-panel">
                <div class="panel-header sell">卖单 (Asks)</div>
                <div class="order-header">
                    <div>价格 (ETH)</div>
                    <div>数量</div>
                    <div>累计</div>
                </div>
                <div class="order-list" id="sellOrders">
                    <div class="empty-state">暂无卖单</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000';
        let socket = null;
        let currentToken = null;

        // DOM 元素
        const tokenInput = document.getElementById('tokenAddress');
        const subscribeBtn = document.getElementById('subscribeBtn');
        const unsubscribeBtn = document.getElementById('unsubscribeBtn');
        const statusIndicator = document.getElementById('statusIndicator');
        const statusText = document.getElementById('statusText');
        const lastUpdate = document.getElementById('lastUpdate');
        const buyOrdersDiv = document.getElementById('buyOrders');
        const sellOrdersDiv = document.getElementById('sellOrders');
        const bestBidSpan = document.getElementById('bestBid');
        const bestAskSpan = document.getElementById('bestAsk');
        const spreadSpan = document.getElementById('spread');
        const midPriceSpan = document.getElementById('midPrice');

        // 连接 WebSocket
        function connect() {
            socket = io(API_URL);

            socket.on('connect', () => {
                console.log('WebSocket 已连接');
                statusIndicator.classList.remove('disconnected');
                statusText.textContent = '已连接';
            });

            socket.on('disconnect', () => {
                console.log('WebSocket 已断开');
                statusIndicator.classList.add('disconnected');
                statusText.textContent = '已断开';
            });

            socket.on('orderbook', (data) => {
                console.log('收到订单簿快照:', data);
                updateOrderBook(data);
            });

            socket.on('orderUpdate', (data) => {
                console.log('收到订单更新:', data);
                updateOrderBook(data);
            });
        }

        // 订阅代币
        function subscribe() {
            const token = tokenInput.value.trim();
            if (!token) {
                alert('请输入代币地址');
                return;
            }

            if (!socket || !socket.connected) {
                alert('WebSocket 未连接');
                return;
            }

            currentToken = token;
            socket.emit('subscribe', { token });
            
            subscribeBtn.disabled = true;
            unsubscribeBtn.disabled = false;
            tokenInput.disabled = true;
            
            console.log('已订阅代币:', token);
        }

        // 取消订阅
        function unsubscribe() {
            if (currentToken && socket) {
                socket.emit('unsubscribe', { token: currentToken });
                console.log('已取消订阅代币:', currentToken);
            }

            currentToken = null;
            subscribeBtn.disabled = false;
            unsubscribeBtn.disabled = true;
            tokenInput.disabled = false;
            
            // 清空订单簿
            buyOrdersDiv.innerHTML = '<div class="empty-state">暂无买单</div>';
            sellOrdersDiv.innerHTML = '<div class="empty-state">暂无卖单</div>';
            updateStats(null, null);
        }

        // 更新订单簿
        function updateOrderBook(data) {
            const bids = data.bids || [];
            const asks = data.asks || [];

            // 更新买单
            if (bids.length > 0) {
                buyOrdersDiv.innerHTML = bids.map((order, index) => {
                    const remaining = parseFloat(order.amount) - parseFloat(order.filledAmount || 0);
                    const total = bids.slice(0, index + 1).reduce((sum, o) => 
                        sum + (parseFloat(o.amount) - parseFloat(o.filledAmount || 0)), 0
                    );
                    return `
                        <div class="order-item buy new">
                            <div class="price">${parseFloat(order.price).toFixed(6)}</div>
                            <div>${remaining.toFixed(2)}</div>
                            <div>${total.toFixed(2)}</div>
                        </div>
                    `;
                }).join('');
            } else {
                buyOrdersDiv.innerHTML = '<div class="empty-state">暂无买单</div>';
            }

            // 更新卖单
            if (asks.length > 0) {
                sellOrdersDiv.innerHTML = asks.map((order, index) => {
                    const remaining = parseFloat(order.amount) - parseFloat(order.filledAmount || 0);
                    const total = asks.slice(0, index + 1).reduce((sum, o) => 
                        sum + (parseFloat(o.amount) - parseFloat(o.filledAmount || 0)), 0
                    );
                    return `
                        <div class="order-item sell new">
                            <div class="price">${parseFloat(order.price).toFixed(6)}</div>
                            <div>${remaining.toFixed(2)}</div>
                            <div>${total.toFixed(2)}</div>
                        </div>
                    `;
                }).join('');
            } else {
                sellOrdersDiv.innerHTML = '<div class="empty-state">暂无卖单</div>';
            }

            // 更新统计
            updateStats(bids[0], asks[0]);

            // 更新时间
            const now = new Date();
            lastUpdate.textContent = now.toLocaleTimeString();
        }

        // 更新统计信息
        function updateStats(bestBid, bestAsk) {
            if (bestBid) {
                const bidPrice = parseFloat(bestBid.price);
                bestBidSpan.textContent = bidPrice.toFixed(6);
                bestBidSpan.style.color = '#4CAF50';
            } else {
                bestBidSpan.textContent = '-';
                bestBidSpan.style.color = '#fff';
            }

            if (bestAsk) {
                const askPrice = parseFloat(bestAsk.price);
                bestAskSpan.textContent = askPrice.toFixed(6);
                bestAskSpan.style.color = '#f44336';
            } else {
                bestAskSpan.textContent = '-';
                bestAskSpan.style.color = '#fff';
            }

            if (bestBid && bestAsk) {
                const bidPrice = parseFloat(bestBid.price);
                const askPrice = parseFloat(bestAsk.price);
                const spreadValue = askPrice - bidPrice;
                const midPriceValue = (bidPrice + askPrice) / 2;

                spreadSpan.textContent = spreadValue.toFixed(6);
                midPriceSpan.textContent = midPriceValue.toFixed(6);
            } else {
                spreadSpan.textContent = '-';
                midPriceSpan.textContent = '-';
            }
        }

        // 事件监听
        subscribeBtn.addEventListener('click', subscribe);
        unsubscribeBtn.addEventListener('click', unsubscribe);
        tokenInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                subscribe();
            }
        });

        // 初始化
        connect();
    </script>
</body>
</html>
